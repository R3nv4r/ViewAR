<html lang="es">
<head>
    
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="js/rostro.js"></script>

  <title>RA de cara</title>
  <link rel="stylesheet" href="css/cara.css">

</head>

<style>.a-enter-vr-button {
    display: none !important;
  }</style>

<body>
   <!-- Loading Screen -->
   <div id="loading-screen">
    <h1>Loading...</h1>
  </div>
  <div class="video-container">
    
    <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
      <!-- Cargar los modelos 3D -->
        <a-asset-item id="Mascara" src="assets/interactivo/mariposas.glb"></a-asset-item>   
      </a-assets>

      <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Modelos 3D sobre la cara -->
      <a-entity mindar-face-target="anchorIndex: 1">
        <a-gltf-model rotation="0 -90 0" position="0 -0.1 -0.3" scale="0.2 0.2 0.2" src="#Mascara" animation-mixer></a-gltf-model>
      </a-entity>
    </a-scene>
      
   <div class="controls">
  <button id="save-button" aria-label="Guardar imagen">
    <img src="assets/camera_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="Icono de cámara">
  </button>
  <a id="download-link" style="display: none" aria-label="Descargar imagen">Descargar Imagen</a>
</div>
  </div>

  <script src="js/loadingScreen.js"></script>
</body>
</html>
