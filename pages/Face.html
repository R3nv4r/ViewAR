<!DOCTYPE html>
<html lang="es">
<head>
    
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="../js/captura.js"></script>

  <title>Shorts Clone</title>
  <link rel="stylesheet" href="../css/camera.css">

</head>

<style>.a-enter-vr-button {
    display: none !important;
  }</style>

<body>
  <div class="video-container">
    <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
      <!-- Cargar los modelos 3D -->
        <a-asset-item id="Mascara" src="https://r3nv4r.github.io/ViewAR/assets/Mascara.glb"></a-asset-item>   
      </a-assets>

      <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Modelos 3D sobre la cara -->
      <a-entity mindar-face-target="anchorIndex: 1">
        <a-gltf-model rotation="0 180 0" position="0 0 0" scale="0.4 0.4 0.4" src="#Mascara"></a-gltf-model>
      </a-entity>
    </a-scene>
      
    <div class="controls">
      <button id="save-button" aria-label="Guardar imagen">Save</button>
      <a id="download-link" style="display: none" aria-label="Descargar imagen">Descargar Imagen</a>
    </div>  

    <div class="video-overlay">
      <div class="video-info">
        <h2>Casa del agua</h2>
        <p>Descripción del video</p>
        <button class="return-button" onclick="window.location.href='../Index.html'" aria-label="Volver a la página principal">atras</button>
      </div>
    </div>
  </div>
</body>
</html>
