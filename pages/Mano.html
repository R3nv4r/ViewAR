<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="../css/camera.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="../js/captura.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>


  <script>
    if (window.DeviceOrientationEvent) {
      window.addEventListener("deviceorientation", (event) => {
        const alpha = event.alpha || 0; // Rotación en el eje Z
        const beta = event.beta || 0; // Inclinación adelante/atrás (X)
        const gamma = event.gamma || 0; // Inclinación izquierda/derecha (Y)
        const camera = document.querySelector('a-camera');
        camera.setAttribute('rotation', `${beta} ${alpha} ${-gamma}`);
      });
    }
    window.drawConnectors = window.drawConnectors || drawingUtils.drawConnectors;
    window.drawLandmarks = window.drawLandmarks || drawingUtils.drawLandmarks;
    window.HAND_CONNECTIONS = window.HAND_CONNECTIONS || hands.HAND_CONNECTIONS;
  </script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    
    #instructions {
      position: absolute;
      color: white;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <video class="input_video" autoplay playsinline muted></video>
    <canvas class="output_canvas" width="640" height="480"></canvas>
  </div>

  <a-scene>
    <a-assets>
      <a-asset-item id="objeto3d" src="https://r3nv4r.github.io/ViewAR/assets/pez.glb"></a-asset-item>
      
    </a-assets>
    <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
    <a-light type="directional" position="0 1 1" intensity="0.8"></a-light>
    <a-camera position="0 1.6 3"></a-camera>
    <a-entity id="hand-model" visible="false">
      
      <a-gltf-model src="#objeto3d" animation-mixer="clip: *; loop: repeat; timeScale: 1"></a-gltf-model>
    </a-entity>
  </a-scene>
    </a-entity>
  </a-scene>

  <!-- Botón de retorno -->
  <button id="return-button" onclick="window.location.href='../Index.html'" aria-label="Volver a la página principal">
    <i class="fas fa-arrow-left"></i>
  </button>
  <!-- Botón de guardar -->
  <div class="controls">
    <button id="save-button" aria-label="Guardar imagen">Save</button>
    <a id="download-link" style="display: none" aria-label="Descargar imagen">Descargar Imagen</a>
  </div>
  <!-- Instrucciones para el usuario -->
  <div id="instructions">Abre la palma para mostrar el objeto 3D. Cierra el puño para ocultarlo. Rota la mano para girar el objeto.</div>

  <script type="module">
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    const instructions = document.getElementById('instructions');
    let firstDetection = true;
    let lastPosition = { x: 0, y: 0, z: 0 }; // Para suavizar la posición
  
    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          window.drawConnectors(canvasCtx, landmarks, window.HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 5});
          window.drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2});
        }
  
        // Ocultar instrucciones después de la primera detección
        if (firstDetection) {
          instructions.style.display = 'none';
          firstDetection = false;
        }
  
        const handModel = document.getElementById('hand-model');
        const landmarks = results.multiHandLandmarks[0];
  
        // Detectar palma abierta
        const isOpenPalm = landmarks[8].y < landmarks[6].y && 
                           landmarks[12].y < landmarks[10].y && 
                           landmarks[16].y < landmarks[14].y && 
                           landmarks[20].y < landmarks[18].y;
  
        // Detectar puño cerrado
        const isClosedFist = landmarks[8].y > landmarks[6].y && 
                             landmarks[12].y > landmarks[10].y;
  
        // Mostrar u ocultar el modelo
        if (isOpenPalm) {
          handModel.setAttribute('visible', true);
        } else if (isClosedFist) {
          handModel.setAttribute('visible', false);
        }
  
        // Calcular escala dinámica
        const distance = Math.sqrt(
          Math.pow(landmarks[0].x - landmarks[9].x, 2) +
          Math.pow(landmarks[0].y - landmarks[9].y, 2)
        );
        const scale = distance * 2;
        handModel.setAttribute('scale', `${scale} ${scale} ${scale}`);
  
        // Calcular el centro de la palma usando más puntos de referencia
        const palmCenter = {
          x: (landmarks[0].x + landmarks[5].x + landmarks[9].x + landmarks[13].x + landmarks[17].x) / 5, // Promedio de muñeca y bases de dedos
          y: (landmarks[0].y + landmarks[5].y + landmarks[9].y + landmarks[13].y + landmarks[17].y) / 5,
          z: (landmarks[0].z + landmarks[5].z + landmarks[9].z + landmarks[13].z + landmarks[17].z) / 5
        };
  
        // Transformar al espacio 3D de A-Frame
        const targetX = (palmCenter.x - 0.5) * 3; // Ajuste horizontal
        const targetY = (0.5 - palmCenter.y) * 2; // Ajuste vertical
        const targetZ = -1 * (palmCenter.z + 0.5); // Ajuste de profundidad
  
        // Suavizar la posición para evitar saltos
        const smoothingFactor = 0.3;
        lastPosition.x += (targetX - lastPosition.x) * smoothingFactor;
        lastPosition.y += (targetY - lastPosition.y) * smoothingFactor;
        lastPosition.z += (targetZ - lastPosition.z) * smoothingFactor;
        handModel.setAttribute('position', `${lastPosition.x} ${lastPosition.y} ${lastPosition.z}`);
  
        // Calcular rotación del modelo
        const dx = landmarks[9].x - landmarks[0].x;
        const dy = landmarks[9].y - landmarks[0].y;
        const dz = landmarks[9].z - landmarks[0].z;
        const yaw = -Math.atan2(dy, dx) * (180 / Math.PI);
        const pitch = -Math.atan2(dz, Math.sqrt(dx * dx + dy * dy)) * (180 / Math.PI);
        const currentRotation = handModel.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        const newYaw = currentRotation.y + (yaw - currentRotation.y) * smoothingFactor;
        const newPitch = currentRotation.x + (pitch - currentRotation.x) * smoothingFactor;
        handModel.setAttribute('rotation', `${newPitch} ${newYaw} 0`);
      } else {
        const handModel = document.getElementById('hand-model');
        handModel.setAttribute('visible', false);
      }
      canvasCtx.restore();
    }
  
    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);
  
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({image: videoElement});
      },
      width: 640,
      height: 480,
      facingMode: 'environment'
    });
  
    camera.start().catch(() => {
      camera.setOptions({ facingMode: 'user' });
      camera.start();
    });
  </script>
</body>
</html>
