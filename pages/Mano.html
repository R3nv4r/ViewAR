<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/camera.css"> <!-- Link to the existing CSS file -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Link to Font Awesome -->
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="../js/captura.js"></script> <!-- Link to the external JavaScript file -->
    <style>
      .a-enter-vr-button {
        display: none !important;
      }
      #video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }
      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <a-scene webxr="requiredFeatures: hand-tracking">
      <a-assets>
        <a-asset-item id="objeto3d" src="../assets/flauta.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 1.6 3"></a-camera>
      <a-entity id="hand-model" visible="false">
        <<a-sphere color="green" radius="0.1"></a-sphere>
      </a-entity>
    </a-scene>

    <!-- Add the video and canvas elements to the HTML -->
    <video id="video" autoplay></video>
    <canvas id="canvas"></canvas>

    <!-- Return button as an icon -->
    <button id="return-button" onclick="window.location.href='../Index.html'">
      <i class="fas fa-arrow-left"></i>
    </button>

    <!-- Save button -->
    <div class="controls">
      <button id="save-button">Save</button>
      <a id="download-link" style="display: none">Descargar Imagen</a>
    </div>
    <script>
      async function initHandTracking() {
        console.log('Initializing hand tracking...');
        const hands = new Hands({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1 });

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        video.width = 640;
        video.height = 480;
        canvas.width = 640;
        canvas.height = 480;

        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
          console.log('Camera stream started');
          video.srcObject = stream;
          video.play();
        }).catch(error => {
          console.error('Error accessing the camera: ', error);
        });

        hands.onResults(results => {
          console.log('Hand tracking results:', results);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          if (results.multiHandLandmarks.length > 0) {
            let landmarks = results.multiHandLandmarks[0];

            // Draw landmarks
            ctx.fillStyle = 'red';
            for (let i = 0; i < landmarks.length; i++) {
              let x = landmarks[i].x * canvas.width;
              let y = landmarks[i].y * canvas.height;
              ctx.beginPath();
              ctx.arc(x, y, 5, 0, 2 * Math.PI);
              ctx.fill();
            }

            // Detect if the hand is open (fingers extended)
            let isOpen = landmarks[8].y < landmarks[6].y && // Index
                         landmarks[12].y < landmarks[10].y && // Middle
                         landmarks[16].y < landmarks[14].y && // Ring
                         landmarks[20].y < landmarks[18].y;   // Pinky

            // Show the model if the hand is open
            const handModel = document.getElementById('hand-model');
            handModel.setAttribute('visible', isOpen);
          }
        });

        const camera = new Camera(video, {
          onFrame: async () => {
            await hands.send({ image: video });
          }
        });
        camera.start();
        console.log('Hand tracking initialized');
      }

      initHandTracking();

      AFRAME.registerComponent("detect-open-hand", {
        init: function () {
          this.el.addEventListener("hand-tracking-extras-pinchend", () => {
            console.log("La mano está abierta");
          });

          this.el.addEventListener("hand-tracking-extras-pinchstarted", () => {
            console.log("La mano se cerró");
          });
        },
      });
    </script>
  </body>
</html>
