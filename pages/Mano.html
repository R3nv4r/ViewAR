<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="../css/camera.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script>
    window.drawConnectors = window.drawConnectors || drawingUtils.drawConnectors;
    window.drawLandmarks = window.drawLandmarks || drawingUtils.drawLandmarks;
    window.HAND_CONNECTIONS = window.HAND_CONNECTIONS || hands.HAND_CONNECTIONS;
  </script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    .input_video {
      display: none;
    }
    .container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .input_video, .output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="container">
    <video class="input_video" autoplay playsinline muted></video>
    <canvas class="output_canvas" width="1280px" height="720px"></canvas>
  </div>

  <a-scene>
    <a-assets>
      <a-asset-item id="objeto3d" src="https://r3nv4r.github.io/ViewAR/assets/Mascara.glb"></a-asset-item>
    </a-assets>
    <a-camera position="0 1.6 3"></a-camera>
    <a-entity id="hand-model" visible="false">
      <a-gltf-model src="#objeto3d" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>
  </a-scene>

  <!-- Botón de retorno -->
  <button id="return-button" onclick="window.location.href='../Index.html'">
    <i class="fas fa-arrow-left"></i>
  </button>

  <script type="module">
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    
    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          window.drawConnectors(canvasCtx, landmarks, window.HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 5});
          window.drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2});
        }

        // Detect an open palm gesture
        const handModel = document.getElementById('hand-model');
        const landmarks = results.multiHandLandmarks[0];
        const isOpenPalm = landmarks[8].y < landmarks[6].y && // Index finger
                           landmarks[12].y < landmarks[10].y && // Middle finger
                           landmarks[16].y < landmarks[14].y && // Ring finger
                           landmarks[20].y < landmarks[18].y;   // Pinky finger

        // Show the model if the hand is an open palm
        handModel.setAttribute('visible', isOpenPalm);

        const palmCenter = {
          x: (landmarks[0].x + landmarks[5].x) / 2,  // Average between the wrist and the base of the index finger
          y: (landmarks[0].y + landmarks[5].y) / 2,
          z: (landmarks[0].z + landmarks[5].z) / 2
        };

        const x = (palmCenter.x - 0.5) * 3;
        const y = (0.5 - palmCenter.y) * 2;
        const z = -1 * (palmCenter.z + 0.5);
        const depthFactor = Math.max(0.1, 1 - palmCenter.z); // Scale based on depth

        handModel.setAttribute('scale', `${depthFactor} ${depthFactor} ${depthFactor}`);
        handModel.setAttribute('position', `${x} ${y} ${z}`);
      } else {
        // Hide the model if no hand is detected
        const handModel = document.getElementById('hand-model');
        handModel.setAttribute('visible', false);
      }
      canvasCtx.restore();
    }
    
    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);
    
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({image: videoElement});
      },
      width: 1280,
      height: 720,
      facingMode: 'environment' // Force the rear camera on mobile devices
    });
    camera.start();
  </script>
</body>
</html>
