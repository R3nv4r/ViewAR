<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RA detonadores</title>
  <link rel="stylesheet" href="../css/detonadores.css"> 
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    /* Oculta el botón de VR de A-Frame */
    .a-enter-vr-button {
      display: none !important;
    }


  </style>
</head>
<body>
 
  
  <!-- Botón de pantalla completa -->
  <button class="fullscreen-btn" onclick="toggleFullScreen()">
    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 14H5V19H10V17H7V14ZM5 10H7V7H10V5H5V10ZM17 17H14V19H19V14H17V17ZM14 5V7H17V10H19V5H14Z" fill="#F0F7FF"/>
    </svg>
  </button>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <h1>Loading...</h1>
  </div>
  
  <div class="video-container">
    <canvas id="overlay"></canvas>
    <a-scene mindar-image="imageTargetSrc:../targets.mind;filterMinCF:0.0001; filterBeta: 10" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="recoleccion" src="../assets/infiltracion.glb"></a-asset-item>
        <a-asset-item id="evaporacion" src="../assets/evaporacion.glb"></a-asset-item>
        <a-asset-item id="condensacion" src="../assets/1condensacion.glb"></a-asset-item>
        <a-asset-item id="presipitacion" src="../assets/escurrimiento.glb"></a-asset-item>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#recoleccion" position="0 0 0" height="0.5" width="0.5" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model src="#evaporacion" position="0 0 0" height="0.5" width="0.5" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model src="#condensacion" position="0 0 0" height="0.5" width="0.5" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model src="#presipitacion" position="0 0 0" height="0.5" width="0.5" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
    </a-scene>

    <!-- Botón de pantalla completa -->
    <button class="fullscreen-btn" onclick="toggleFullScreen()">Pantalla Completa</button>
  </div>


  <script src="../js/loadingScreen.js"></script>
  <script src="../js/captura.js"></script>
</body>
</html>
