<!DOCTYPE html>
<html lang="es">
<head>
    
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
    
    <link rel="stylesheet" href="../css/camera.css"> 

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <title>RA detonadores</title>
</head>

<style>.a-enter-vr-button {
    display: none !important;
  }</style>

<body>
      <!-- Loading Screen -->
      <div id="loading-screen">
        <h1>Loading...</h1>
      </div>
  <div class="video-container">
    <canvas id="overlay"></canvas>
    <a-scene mindar-image="imageTargetSrc:../targets.mind; " color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
     
      <!--Espacio para añadir los modelos 3d-->
        <!--/////////////////////////////////////////////////////////////////////////////////////-->
      <a-assets>
        <!--recoleccion-->
        <a-asset-item id="recoleccion" src="../assets/1.glb"></a-asset-item>
        <!--evaporacion-->
        <a-asset-item id="evaporacion" src="../assets/2.glb"></a-asset-item>
        <!--condensacion -->
        <a-asset-item id="condensacion" src="../assets/3.glb"></a-asset-item>
        <!--presipitacion -->
        <a-asset-item id="presipitacion" src="../assets/4.glb"></a-asset-item>
      </a-assets>
      <!--/////////////////////////////////////////////////////////////////////////////////////-->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!--detonadores, aqui se modifica el tamaño, posicion y la rotacion del modelo para ajustar, para identificar los modelos con 
      sus detonadores es con targetIndex: "#" iniciando del 0, el orden sera segun como se compilo en la pagina los detonadores -->
     <!--/////////////////////////////////////////////////////////////////////////////////////-->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#recoleccion" position="0 0 0" scale="1 1 1" rotation="0  0  0" animation-Mixer>
    </a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model src="#evaporacion" position="0 0 0" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Fixed 2D overlay text on screen -->
      <div style="position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; color: #FFD700; font-size: 2em; font-family: 'Exo 2', sans-serif; text-shadow: 1px 1px 4px #000;" id="evaporacion-text">
        ¡Evaporación detectada!
      </div>
      <script>
        // Show/hide overlay text based on target detection
        document.addEventListener("DOMContentLoaded", function() {
          const scene = document.querySelector("a-scene");
          const textDiv = document.getElementById("evaporacion-text");
          textDiv.style.display = "none";
          scene.addEventListener("targetFound", e => {
        if (e && e.detail && e.detail.targetIndex === 1) {
          textDiv.style.display = "block";
        }
          });
          scene.addEventListener("targetLost", e => {
        if (e && e.detail && e.detail.targetIndex === 1) {
          textDiv.style.display = "none";
        }
          });
        });
      </script>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model src="#condensacion" position="0 0 0" scale="1 1 1" rotation="0  0  0" animation-Mixer>
    </a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model src="#presipitacion" position="0 0 0" scale="0.5 0.5 0.5" rotation="0  0  0" animation-Mixer>
    </a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 4">
        <a-gltf-model src="#flauta" position="0 0 0" scale="0.5 0.5 0.5" rotation="0 -90 -30" animation-Mixer>
    </a-gltf-model>
      </a-entity>
   <!--/////////////////////////////////////////////////////////////////////////////////////-->
    </a-scene>
    

  <script src="../js/loadingScreen.js"></script>
  <script src="../js/captura.js"></script>

  <!--div class="video-overlay">
      <div class="video-info">
        
        <h2>Casa del agua</h2>
        <p>Descripción del video</p>
        <button class="return-button" onclick="window.location.href='../Index.html'" aria-label="Volver a la página principal">atras</button>
      </div>
    </div-->
  </div>
</body>
</html>
