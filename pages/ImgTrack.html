<!DOCTYPE html>
<html lang="es">
<head>
    
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
    
    <link rel="stylesheet" href="../css/camera.css"> 

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <title>RA detonadores</title>
</head>

<style>.a-enter-vr-button {
    display: none !important;
  }</style>

<body>
      <!-- Loading Screen -->
      <div id="loading-screen">
        <h1>Loading...</h1>
      </div>
       <div id="description-container"></div>
  <div class="video-container">
    <canvas id="overlay"></canvas>
    <a-scene mindar-image="imageTargetSrc:../targets.mind; " color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
     
      <!--Espacio para añadir los modelos 3d-->
        <!--/////////////////////////////////////////////////////////////////////////////////////-->
      <a-assets>
        <!--recoleccion-->
        <a-asset-item id="recoleccion" src="../assets/1.glb"></a-asset-item>
        <!--evaporacion-->
        <a-asset-item id="evaporacion" src="../assets/2.glb"></a-asset-item>
        <!--condensacion -->
        <a-asset-item id="condensacion" src="../assets/3.glb"></a-asset-item>
        <!--presipitacion -->
        <a-asset-item id="presipitacion" src="../assets/4.glb"></a-asset-item>
      </a-assets>
      <!--/////////////////////////////////////////////////////////////////////////////////////-->
      <a-camera position="0 0 0" ></a-camera>

      <!--detonadores, aqui se modifica el tamaño, posicion y la rotacion del modelo para ajustar, para identificar los modelos con 
      sus detonadores es con targetIndex: "#" iniciando del 0, el orden sera segun como se compilo en la pagina los detonadores -->
     <!--/////////////////////////////////////////////////////////////////////////////////////-->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#recoleccion" position="0 0 0" scale="1 1 1" rotation="0  0  0" animation-Mixer>
    </a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" visible="false">
        <a-gltf-model src="#evaporacion" position="0 0 0" rotation="0 0 0" animation-mixer></a-gltf-model>
        
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model src="#condensacion" position="0 0 0" scale="1 1 1" rotation="0  0  0" animation-Mixer>
    </a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model src="#presipitacion" position="0 0 0" scale="0.5 0.5 0.5" rotation="0  0  0" animation-Mixer>
    </a-gltf-model>
      </a-entity>

 
   <!--/////////////////////////////////////////////////////////////////////////////////////-->
    </a-scene>
    

  <script src="../js/loadingScreen.js"></script>
  <script src="../js/captura.js"></script>

      <!-- Script para manejar el texto descriptivo -->
    <script>
      // Definir textos descriptivos para cada targetIndex
      const descriptions = {
        0: "Recolección: El agua se acumula en ríos, lagos y océanos.",
        1: "Evaporación: El agua se transforma en vapor por el calor del sol.",
        2: "Condensación: El vapor de agua se enfría y forma nubes.",
        3: "Precipitación: El agua cae de las nubes en forma de lluvia, nieve o granizo.",
        4: "Flauta: Un instrumento musical que representa la interacción con el agua."
      };

      // Obtener el contenedor de descripción
      const descriptionContainer = document.getElementById('description-container');

      // Escuchar eventos de los marcadores
      document.addEventListener('DOMContentLoaded', () => {
        const scene = document.querySelector('a-scene');
        scene.addEventListener('targetFound', (event) => {
          const targetIndex = event.target.getAttribute('mindar-image-target').targetIndex;
          // Mostrar el texto correspondiente
          descriptionContainer.textContent = descriptions[targetIndex] || "Descripción no disponible";
          descriptionContainer.style.display = 'block';
        });

        scene.addEventListener('targetLost', () => {
          // Ocultar el texto cuando se pierde el marcador
          descriptionContainer.style.display = 'none';
          descriptionContainer.textContent = '';
        });
      });
    </script>
  <!--div class="video-overlay">
      <div class="video-info">
        
        <h2>Casa del agua</h2>
        <p>Descripción del video</p>
        <button class="return-button" onclick="window.location.href='../Index.html'" aria-label="Volver a la página principal">atras</button>
      </div>
    </div-->
  </div>
</body>
</html>
