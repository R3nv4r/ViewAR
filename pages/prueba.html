<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RA detonadores</title>
  <link rel="stylesheet" href="../css/camera.css"> 
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    /* Oculta el botón de VR de A-Frame */
    .a-enter-vr-button {
      display: none !important;
    }

    /* Estilo para el botón de pantalla completa */
    .fullscreen-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000; /* Asegura que esté por encima de la escena AR */
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .fullscreen-btn:hover {
      background-color: #0056b3;
    }

    /* Mensaje para forzar orientación horizontal */
    #orientation-message {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      text-align: center;
      padding-top: 50%;
      font-size: 18px;
      z-index: 2000; /* Por encima de todo */
    }

    /* Mostrar mensaje en modo vertical */
    @media (orientation: portrait) {
      body > *:not(#orientation-message) {
        display: none; /* Oculta todo el contenido excepto el mensaje */
      }
      #orientation-message {
        display: block;
      }
    }

    /* Ajuste para móviles */
    @media (max-width: 600px) {
      .fullscreen-btn {
        padding: 8px 12px;
        font-size: 14px;
      }
      #orientation-message {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- Mensaje de orientación -->
  <div id="orientation-message">
    Por favor, rota tu dispositivo a modo horizontal para continuar.
  </div>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <h1>Loading...</h1>
  </div>
  
  <div class="video-container">
    <canvas id="overlay"></canvas>
    <a-scene mindar-image="imageTargetSrc:../targets.mind;filterMinCF:0.0001; filterBeta: 10" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="recoleccion" src="../assets/1.glb"></a-asset-item>
        <a-asset-item id="evaporacion" src="../assets/2.glb"></a-asset-item>
        <a-asset-item id="condensacion" src="../assets/3.glb"></a-asset-item>
        <a-asset-item id="presipitacion" src="../assets/4.glb"></a-asset-item>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#recoleccion" position="0 0 0" scale="1 1 1" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model src="#evaporacion" position="0 0 0" scale="1 1 1" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model src="#condensacion" position="0 0 0" scale="1 1 1" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model src="#presipitacion" position="0 0 0" scale="1 1 1" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
    </a-scene>

    <!-- Botón de pantalla completa -->
    <button class="fullscreen-btn" onclick="toggleFullScreen()">Pantalla Completa</button>
  </div>

  <script>
    // Intentar forzar orientación horizontal (si el navegador lo soporta)
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(err => {
        console.log('No se pudo bloquear la orientación:', err);
      });
    }

    // Función para pantalla completa
    function toggleFullScreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Safari */
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE11 */
          elem.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) { /* Safari */
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) { /* IE11 */
          document.msExitFullscreen();
        }
      }
    }

    // Mostrar mensaje inicial para pantalla completa en modo horizontal
    window.addEventListener('load', () => {
      if (window.matchMedia("(orientation: landscape)").matches) {
        // Mostrar un mensaje breve para sugerir pantalla completa
        setTimeout(() => {
          alert("Para una mejor experiencia, presiona el botón 'Pantalla Completa' en la esquina superior derecha.");
        }, 1000); // Mostrar después de 1 segundo para evitar interrumpir la carga
      }
    });
  </script>

  <script src="../js/loadingScreen.js"></script>
  <script src="../js/captura.js"></script>
</body>
</html>
