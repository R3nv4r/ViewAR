<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RA detonadores</title>
  <link rel="stylesheet" href="../css/detonadores.css"> 
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    /* Oculta el botón de VR de A-Frame */
    .a-enter-vr-button {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Mensaje de orientación -->
  <div id="orientation-message">
    Activa la pantalla completa para continuar.
  </div>
  
  <!-- Botón de pantalla completa -->
  <button class="fullscreen-btn" onclick="toggleFullScreen()">
    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 14H5V19H10V17H7V14ZM5 10H7V7H10V5H5V10ZM17 17H14V19H19V14H17V17ZM14 5V7H17V10H19V5H14Z" fill="#F0F7FF"/>
    </svg>
  </button>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <h1>Cargando...</h1>
  </div>
  
  <div class="video-container">
    <canvas id="overlay"></canvas>
    <a-scene mindar-image="imageTargetSrc:../targets.mind;filterMinCF:0.001; filterBeta: 5" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled:false ">
      <a-assets>
        <a-asset-item id="recoleccion" src="../assets/1.glb"></a-asset-item>
        <a-asset-item id="evaporacion" src="../assets/2.glb"></a-asset-item>
        <a-asset-item id="condensacion" src="../assets/3.glb"></a-asset-item>
        <a-asset-item id="presipitacion" src="../assets/4.glb"></a-asset-item>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#recoleccion" position="0 0 0" scale="1 1 1" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model src="#evaporacion" position="0 0 0" scale="1 1 1" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model src="#condensacion" position="0 0 0" scale="1 1 1" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model src="#presipitacion" position="0 0 0" scale="1 1 1" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
    </a-scene>
  </div>

  <script>
    function toggleFullScreen() {
      const elem = document.documentElement;
      const message = document.querySelector('#orientation-message');
      const videoContainer = document.querySelector('.video-container');
      const fullscreenBtn = document.querySelector('.fullscreen-btn');

      if (!document.fullscreenElement) {
        try {
          if (elem.requestFullscreen) {
            elem.requestFullscreen();
          } else if (elem.webkitRequestFullscreen) { /* Safari */
            elem.webkitRequestFullscreen();
          } else if (elem.msRequestFullscreen) { /* IE11 */
            elem.msRequestFullscreen();
          }
          // Oculta el mensaje y muestra el contenido
          if (message) {
            message.style.display = 'none';
          }
          if (videoContainer) {
            videoContainer.style.display = 'block';
          }
          // Mueve el botón a la esquina inferior derecha
          if (fullscreenBtn) {
            fullscreenBtn.style.top = 'auto';
            fullscreenBtn.style.bottom = '20px';
            fullscreenBtn.style.right = '20px';
          }
        } catch (err) {
          console.error('Error al activar pantalla completa:', err);
        }
      } else {
        try {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) { /* Safari */
            document.webkitExitFullscreen();
          } else if (document.msExitFullscreen) { /* IE11 */
            document.msExitFullscreen();
          }
          // Muestra el mensaje y oculta el contenido
          if (message) {
            message.style.display = 'block';
          }
          if (videoContainer) {
            videoContainer.style.display = 'none';
          }
          // Restaura la posición original del botón
          if (fullscreenBtn) {
            fullscreenBtn.style.top = '60%';
            fullscreenBtn.style.bottom = 'auto';
            fullscreenBtn.style.right = '40%';
          }
        } catch (err) {
          console.error('Error al salir de pantalla completa:', err);
        }
      }
    }
  </script>

  <script src="../js/loadingScreen.js"></script>
</body>
</html>
